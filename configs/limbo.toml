[paths]

game_files="../gamefiles/limbo/"
support_files="../gamefiles/support_files/"

android_package_code="/fakepath_package_code"
android_external_files="/fakepath_external_files"
android_files="/fakepath_files"
android_obb_dirs=["/fakepath_obb"]
android_source_dirs=["/fakepath_source"]
android_cache="cache/"

# Reported as ApplicationInfo.nativeLibraryDir. Limbo reads it to locate native
# libraries sitting next to its own binary; relative to game_files.
android_native_lib_dir="arm64-v8a/"


[package]

packageName="com.playdead.limbo"
versionName="1.20"
mainIntentBundle = {}


[device]

displayWidth=1280
displayHeight=720
displayRotation=0
fullscreen=false

# AConfiguration_getTouchscreen: 1 = NOTOUCH, 2 = STYLUS, 3 = FINGER.
# This MUST be 3 -- Limbo's front end is touch-driven, and a game told there is
# no touchscreen can disable that input path outright.
displayTouchscreen=3

# AConfiguration_getOrientation: 1 = PORT, 2 = LAND. Note that thunks/ndk/ndk.cpp
# reads this from displayRotation, which laytonloader instead uses as a rotation
# in degrees -- the same key means different things to the two loaders. Limbo
# does no rotation, so it is safe to use it as the orientation enum here.
displayRotation=2

displayDensity=160
language="en"
country="US"


[input]

# Gamepad support. Limbo takes input through the native AInputQueue rather than
# JNI, so limboloader translates SDL controller events itself (see
# projects/limboloader/main.cpp) -- this flag is read by
# platform/common/input_backend.cpp, which limboloader does not use.
controller=true
touch_mode=false
accurate_mode=false
