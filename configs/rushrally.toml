[paths]

# assets/ and lib/ sit next to the binary, same layout as the Layton/Limbo ports.
game_files="../gamefiles/rushrally/"
support_files="../gamefiles/support_files/"

android_package_code="/fakepath_package_code"
android_external_files="/fakepath_external_files"
android_files="/fakepath_files"
android_obb_dirs=["/fakepath_obb"]
android_source_dirs=["/fakepath_source"]
android_cache="cache/"

# Reported as ApplicationInfo.nativeLibraryDir; relative to game_files.
android_native_lib_dir="lib/arm64-v8a/"


[package]

packageName="brownmonster.app.game.rushrally3"
versionName="1.184"
mainIntentBundle = {}


[device]

displayWidth=1280
displayHeight=720
displayRotation=2

# AConfiguration_getTouchscreen: 1 = NOTOUCH, 2 = STYLUS, 3 = FINGER.
# The manifest declares android.hardware.touchscreen, so this must be 3.
displayTouchscreen=3

displayDensity=160
language="en"
country="US"
