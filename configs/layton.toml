[paths]

game_files="../gamefiles/layton/"
support_files="../gamefiles/support_files/"

android_package_code="/fakepath_package_code"
android_external_files="/fakepath_external_files"
android_files="/fakepath_files"
android_obb_dirs=["/fakepath_obb"]
android_source_dirs=["/fakepath_source"]
android_cache="cache/"


[package]

packageName="com.Level5.LT1R"
versionName="1.0.8"
mainIntentBundle = {}


[device]

# Window size (ignored when fullscreen -- the drawable size is queried from
# SDL instead). The DS layout is portrait, so on a widescreen panel set
# displayRotation=90: the game renders portrait into an offscreen buffer that
# is blitted rotated onto the window. Use 270 if it ends up upside down.
displayWidth=1920
displayHeight=1080
displayRotation=90
fullscreen=true

